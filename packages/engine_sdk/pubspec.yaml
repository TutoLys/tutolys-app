name: engine_sdk
description: >
  The engine contract: registry, context, telemetry client and result types.
  An engine depends on this and the design system only — never on the app,
  the API client or the database.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../design_system
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_schema: ^5.2.1
