name: engine_sdk
description: >
  The engine contract: registry, context, telemetry client and result types.
  An engine depends on this and the design system only — never on the app,
  the API client or the database.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../design_system
  uuid: ^4.5.1
  crypto: ^3.0.6
  # The "read the question aloud" button: a grade-1 reader can't read it
  # yet. Native platforms play from a temp file (DeviceFileSource, the
  # best-supported source type everywhere dart:io exists); web plays
  # straight from bytes (BytesSource, which audioplayers_web backs with a
  # standard Blob URL — the well-supported direction for that platform).
  audioplayers: ^6.5.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_schema: ^5.2.1
