name: tutolys_motion
description: >
  Characters and the animation director. Consumes the runtime's semantic
  events; no engine imports this package, so swapping the placeholder fox
  for Rive never touches game code.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  engine_sdk:
    path: ../engine_sdk
  design_system:
    path: ../design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
