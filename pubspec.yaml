name: tutolys_app
description: >
  TutoLys kid-facing app. One Flutter codebase for desktop, mobile and web.
  Knows nothing about organizations, billing or tutors — a kid is a kid.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local packages. The engines depend on engine_sdk and design_system only,
  # never on the app, the API client or the database (plan §6.3).
  design_system:
    path: packages/design_system
  engine_sdk:
    path: packages/engine_sdk
  engines_core:
    path: packages/engines_core
  tutolys_motion:
    path: packages/tutolys_motion
  # The 3D village on Linux (ADR 0126). Needs libwebkit2gtk-4.1-dev and
  # libsoup-3.0-dev on the build machine.
  village_webview_linux:
    path: packages/village_webview_linux

  flutter_riverpod: ^3.0.3      # state
  go_router: ^17.2.1            # routing
  dio: ^5.9.0                   # HTTP
  flutter_secure_storage: ^9.2.4 # device token, in the platform secure store
  uuid: ^4.5.1

  # Local database. The outbox must be durable before an event is considered
  # logged, so this is not a cache — it is the write path (plan §5.8).
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  crypto: ^3.0.6  # content checksums, matching the backend
  intl: ^0.20.3

  # Runtime, not just the generator: the splash is held until the session
  # has resolved, so the app imports `FlutterNativeSplash.preserve/remove`.
  flutter_native_splash: ^2.4.6
  drift_flutter: ^0.3.1
  sentry: ^10.2.0
  # Browser APIs for repairing the local store on the web (ADR 0099).
  # Already resolved transitively (drift), so this pins nothing new.
  web: ^1.1.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device checks: the Linux 3D village through the real WebKitGTK view
  # (ADR 0126), where widget tests can't reach.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    # The 2026-10-24 design's real artwork, copied verbatim from
    # `docs/design/assets/raw/` (see that folder's README) — the actual bytes
    # Hafid supplied, not re-exported or re-compressed. Subject buildings and
    # the mascot are illustrations that cannot be reproduced in code; the nav
    # icons are PNGs for the same reason.
    - assets/images/
    # The app's own sounds (ADR 0035): two background loops and the shell's
    # effects, re-encoded small from Hafid's originals in Assets/Sounds.
    # Fetched when first played, so not part of the web's first download.
    - assets/sounds/music/
    - assets/sounds/sfx/
    - assets/sounds/songs/
    # The 3D village's bundle (ADR 0126), copied by tool/sync_village3d.sh
    # from codex/village-3d/dist. Web and Linux (served to its WebView over
    # loopback); not mobile yet. Folders aren't recursive; keep in step.
    - path: assets/village3d/
      platforms: [web, linux]
    - path: assets/village3d/assets/fonts/
      platforms: [web, linux]
    - path: assets/village3d/assets/img/
      platforms: [web, linux]
    - path: assets/village3d/assets/models/
      platforms: [web, linux]
    - path: assets/village3d/assets/models/props/
      platforms: [web, linux]
    - path: assets/village3d/src/
      platforms: [web, linux]
    - path: assets/village3d/styles/
      platforms: [web, linux]
    - path: assets/village3d/vendor/three-0.170.0/
      platforms: [web, linux]
    - path: assets/village3d/vendor/three-0.170.0/addons/
      platforms: [web, linux]
    - path: assets/village3d/vendor/three-0.170.0/addons/controls/
      platforms: [web, linux]
    - path: assets/village3d/vendor/three-0.170.0/addons/loaders/
      platforms: [web, linux]
    - path: assets/village3d/vendor/three-0.170.0/addons/utils/
      platforms: [web, linux]

# `dart run flutter_launcher_icons` regenerates web/icons/*.png from these.
# Scoped to web only: Linux desktop has no Flutter-tooling icon pipeline (its
# window icon is set directly in linux/runner/my_application.cc), and mobile
# isn't a build target yet (open item — Hafid's call to defer, not this
# config's to assume either way).
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1F3C88"
    theme_color: "#1F3C88"

# `dart run flutter_native_splash:create` regenerates the web loading splash
# from these. Same web-only scope as flutter_launcher_icons above.
flutter_native_splash:
  color: "#1F3C88"
  image: "assets/icon/icon_maskable.png"
  web: true
  android: false
  ios: false
